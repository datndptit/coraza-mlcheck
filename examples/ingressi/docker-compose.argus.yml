# Ingressi ML overlay: runs the custom Caddy build that embeds the
# datndptit/coraza-mlcheck action. The Argus Sentinel v4 inference service is
# NOT part of this stack: deploy it separately (github.com/datndptit/argus-sidecar)
# and point both stacks at the same socket volume.
services:
  caddy:
    image: ingressi-caddy-argus:local
    environment:
      ARGUS_SOCKET: ${ARGUS_SOCKET:-/run/argus/argus.sock}
      ARGUS_TIMEOUT_MS: ${ARGUS_TIMEOUT_MS:-50}
      ARGUS_MAX_INFLIGHT: ${ARGUS_MAX_INFLIGHT:-64}
      ARGUS_QUEUE_WAIT_MS: ${ARGUS_QUEUE_WAIT_MS:-5}
      ARGUS_CIRCUIT_FAILS: ${ARGUS_CIRCUIT_FAILS:-10}
      ARGUS_CIRCUIT_COOLDOWN_MS: ${ARGUS_CIRCUIT_COOLDOWN_MS:-5000}
      ARGUS_METRICS_INTERVAL_S: ${ARGUS_METRICS_INTERVAL_S:-60}
    volumes:
      - argus-run:/run/argus
  # The port manager passes -f explicitly and therefore ignores COMPOSE_FILE.
  # Keep this overlay when it recreates Caddy after an L4 port change.
  l4-port-manager:
    environment:
      COMPOSE_EXTRA_FILE: /compose/docker-compose.argus.yml
volumes:
  # Shared with the standalone sidecar stack, which creates and names it via
  # ARGUS_SOCKET_VOLUME (same default). External: this project never creates
  # or removes it, so `docker compose down -v` cannot destroy a live socket.
  argus-run:
    external: true
    name: ${ARGUS_SOCKET_VOLUME:-ingressi-argus-run}

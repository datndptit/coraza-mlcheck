# Argus Sentinel v4 — DETECT ONLY with a rule-level threshold
#
# Same as detect.conf, but the threshold is set in TX and compared by the
# action itself (attack_prob > threshold). Use this to run a per-host
# threshold without restarting the sidecar: values are the config.json
# presets (fpr0.1% = 0.998175, fpr0.5% = 0.893281, fpr1% = 0.593510) or any
# float in [0,1]. An invalid value fails open with
# argus_error=invalid_threshold and no RPC — it never silently falls back.
#
# Merge-mode caveat: global custom directives are joined BEFORE host
# directives, so a host rule setting tx.argus_threshold would run after a
# global mlcheck. To give one host its own threshold, keep the WHOLE ML rule
# set per host (do not put ML in the global directives), or use the host's
# override mode and redeclare the rules.
#
# Single lines only; ids 1899999099/1899999100-1899999102 are reserved for
# this example (do not paste together with detect.conf — they would collide).
#
# Audit log note: with the CRS loaded, SecAuditLogRelevantStatus (from
# @coraza.conf-recommended) only records 4xx/5xx transactions, so the detect
# rule carries ctl:auditEngine=On to force flagged requests into the audit
# log / Security events. The error rule stays without it on purpose (a dead
# sidecar would otherwise log one audit event per request).

SecAction "id:1899999099,phase:2,pass,nolog,noauditlog,setvar:'tx.argus_threshold=0.998175'"
SecAction "id:1899999100,phase:2,pass,nolog,noauditlog,mlcheck"
SecRule TX:argus_is_clean "@streq 0" "id:1899999101,phase:2,pass,log,auditlog,ctl:auditEngine=On,severity:WARNING,msg:'Argus v4 detected',tag:'argus-sentinel/v4',logdata:'attack_prob=%{tx.argus_risk_score};threshold=%{tx.argus_threshold}'"
SecRule TX:argus_error "@rx .+" "id:1899999102,phase:2,pass,log,auditlog,severity:WARNING,msg:'Argus v4 unavailable',tag:'argus-sentinel/error',logdata:'reason=%{tx.argus_error}'"

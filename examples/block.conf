# Argus Sentinel v4 — CANARY BLOCKING
#
# Identical to detect.conf except the verdict rule denies: ML detections
# become 403s ON TOP of the CRS decisions (CRS blocks are never reopened).
#
# Requirements:
#   * the WAF must be in "On" mode for this host (DetectionOnly downgrades
#     every deny to a pass);
#   * start from the conservative threshold (sidecar default fpr0.1% =
#     0.998175) and watch fpr on clean traffic before widening;
#   * combine with the detection logdata to review what would have been
#     blocked before flipping.
#
# Rollback: comment out (or delete) the whole set in the scope it was applied
# to, apply the config, THEN stop the sidecar if desired. Removing the plugin
# while a config still references "mlcheck" leaves Caddy unable to load it.
#
# The deny response (403) is 4xx, so it is audited even under the CRS's
# SecAuditLogRelevantStatus; ctl:auditEngine=On is kept anyway so the rule
# behaves identically if it is ever switched back to detect mode.

SecAction "id:1899999100,phase:2,pass,nolog,noauditlog,mlcheck"
SecRule TX:argus_is_clean "@streq 0" "id:1899999101,phase:2,deny,status:403,log,auditlog,ctl:auditEngine=On,severity:CRITICAL,msg:'Argus v4 blocked',tag:'argus-sentinel/v4',logdata:'attack_prob=%{tx.argus_risk_score}'"
SecRule TX:argus_error "@rx .+" "id:1899999102,phase:2,pass,log,auditlog,severity:WARNING,msg:'Argus v4 unavailable',tag:'argus-sentinel/error',logdata:'reason=%{tx.argus_error}'"

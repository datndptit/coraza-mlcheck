# Remote-plugin codegen (requires network; the pre-v4 bundle used this). The
# Docker build and `make proto` use the pinned local toolchain instead.
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: proto
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: proto
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
inputs:
  - directory: proto
